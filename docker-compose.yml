services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bastion}
      POSTGRES_USER: ${POSTGRES_USER:-bastion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bastion_dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9.1.0-alpine3.23
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${VALKEY_PORT:-6380}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.32.1
    profiles: ["local-inference"]
    # Conflicts with host-native Ollama on ${OLLAMA_PORT:-11434}; stop host
    # Ollama before enabling the local-inference profile.
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-model-init:
    image: alpine:3.21
    environment:
      # Default to host-native Ollama. For the optional containerized backend,
      # set COMPOSE_OLLAMA_BASE_URL=http://ollama:11434 and enable
      # local-inference.
      OLLAMA_HOST: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until wget -qO /tmp/ollama-models "$$OLLAMA_HOST/api/tags"; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then
            echo "ollama_unreachable host=$$OLLAMA_HOST attempts=$$attempts" >&2
            exit 1
          fi
          echo "ollama_waiting host=$$OLLAMA_HOST attempt=$$attempts"
          sleep 2
        done
        for model in llama3.1:8b nomic-embed-text; do
          if grep -F -e "\"name\":\"$$model\"" -e "\"name\":\"$$model:latest\"" /tmp/ollama-models >/dev/null; then
            echo "ollama_model_present model=$$model"
          else
            echo "ollama_model_missing model=$$model host=$$OLLAMA_HOST" >&2
            exit 1
          fi
        done
        if wget -qO /dev/null --header='Content-Type: application/json' --post-data='{"model":"llama3.1:8b","prompt":"","stream":false}' "$$OLLAMA_HOST/api/generate"; then
          echo "ollama_model_warmed model=llama3.1:8b endpoint=/api/generate"
        else
          echo "warning=ollama_model_warmup_failed model=llama3.1:8b endpoint=/api/generate" >&2
        fi
        if wget -qO /dev/null --header='Content-Type: application/json' --post-data='{"model":"nomic-embed-text","input":"Bastion model warmup"}' "$$OLLAMA_HOST/api/embed"; then
          echo "ollama_model_warmed model=nomic-embed-text endpoint=/api/embed"
        else
          echo "warning=ollama_model_warmup_failed model=nomic-embed-text endpoint=/api/embed" >&2
        fi

  gate:
    build:
      context: ./gate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bastion}:${POSTGRES_PASSWORD:-bastion_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-bastion}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GATE_PORT: 8000
      GATE_POLICY_PROFILE: ${GATE_POLICY_PROFILE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "${GATE_PORT:-8000}:8000"
    volumes:
      - gate_hf_cache:/var/lib/bastion/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 120s

  sample-target:
    build:
      context: ./sample-target
    env_file: .env
    environment:
      GATE_BASE_URL: http://gate:8000
      SAMPLE_TARGET_PORT: 8080
    depends_on:
      gate:
        condition: service_healthy
    ports:
      - "${SAMPLE_TARGET_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12

  control:
    build:
      context: ./control
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # Postgres always listens on 5432 inside the Docker network regardless
      # of POSTGRES_PORT, which only remaps the host-side binding. Override
      # here so changing POSTGRES_PORT to avoid a host conflict cannot break
      # Control's connection the way it would if this inherited the env_file
      # value.
      POSTGRES_PORT: "5432"
      CONTROL_LISTEN_HOST: 0.0.0.0
      CONTROL_PORT: 5080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONTROL_PORT:-5080}:5080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5080/healthz >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 12

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_CONTROL_BASE_URL: http://localhost:5080
    depends_on:
      control:
        condition: service_healthy
    ports:
      - "5173:80"

  strike:
    build:
      context: .
      dockerfile: strike/Dockerfile
    profiles: ["manual"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bastion}:${POSTGRES_PASSWORD:-bastion_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-bastion}
      OLLAMA_BASE_URL: ${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VALKEY_URL: redis://valkey:6379/0
      BASTION_CONTAINERIZED: "true"
      GATE_POLICY_PROFILE: ${GATE_POLICY_PROFILE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
      sample-target:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  ollama_data:
  gate_hf_cache:

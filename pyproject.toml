[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-cli"
version = "0.1.0"
description = "Compose-backed command line entrypoint for the Bastion local MVP"
requires-python = ">=3.11"

[project.scripts]
bastion = "bastion_cli.cli:main"

[tool.setuptools.packages.find]
include = ["bastion_cli*"]

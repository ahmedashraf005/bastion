  # its clean form in ct-006. Both real carriers are covered:
  # get_most_recent_transactions (payload smuggled into one transaction
  # record's `subject` field, YAML block) and read_file (payload appended
  # directly into unstructured prose, a landlord rent-notice letter). Every
  # payload below is the FULL tool-output text as a detector would actually
  # receive it (the entire transaction list or the entire letter), not an
  # isolated snippet — matching how tool output actually arrives.
